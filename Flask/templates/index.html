<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Todo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="content">
        <h1>Task Master</h1>

        <!-- Create Task Form -->
        <form action="/" method="POST">
            <input type="text" name="content" id="content" placeholder="Enter a task..." required>
            <input type="submit" value="Add Task">
        </form>

        <!-- Read Tasks Table -->
        {% if tasks|length < 1 %}
            <h4 style="text-align: center; color: #555;">No tasks yet. Create one!</h4>
        {% else %}
        <table>
            <tr>
                <th>Task</th>
                <th>Added</th>
                <th>Actions</th>
            </tr>
            {% for task in tasks %}
            <tr>
                <td>{{ task.content }}</td>
                <td>{{ task.date_created.strftime('%Y-%m-%d') }}</td>
                <td>
                    <a href="/update/{{ task.id }}" class="btn-edit">Update</a>
                    <a href="/delete/{{ task.id }}" class="btn-delete">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
        {% endif %}
    </div>
</body>
</html>
