<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="rockstar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="hero">
        <nav>
            <div class="left">
                <img src="./Rockstar_Games.svg" alt="svg">
            </div>
            <div class="middle">

                <div class="GAMES">
                    <span>GAMES</span>
                    <i class="fa-solid fa-angle-down"></i>
                </div>

                <div class="link">NEWSWIRE</div>
                <div class="link">VIDEOS</div>
                <div class="link">DOWNLOADS</div>

                <div class="store">
                    <span>STORE</span>
                    <i class="fa-solid fa-up-right-from-square"></i>
                </div>

                <div class="support">
                    <span>SUPPORT</span>
                    <i class="fa-solid fa-up-right-from-square"></i>
                </div>
            </div>

            <div class="right">
                <div class="get_launcher">
                    <button>Get Launcher</button>

                </div>
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-regular fa-user"></i>
            </div>
            
        </nav>

    </div>

</body>

</html>
