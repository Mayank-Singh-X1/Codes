<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        .container{
            height: 100vh;
            width: 100%;
            display:grid;
            background-color: rgb(0, 0, 0);
            gap:10px;
            padding:10px;
            grid-template-areas:
            "sidebar header header2"
            "sidebar content content"
            "sidebar footer footer2"
            ;
        }
        .container div{
            background-color: rgb(176, 127, 176);
            border-radius: 30px;
        }
        .header{
            grid-area: header;
        }
         .header2{
            grid-area: header2;
        }
        .siderbar{
            grid-area: sidebar;
        }
        .content{
            grid-area: content;
        }
        .footer{
            grid-area: footer;
        }
        .footer2{
            grid-area: footer2;
        }

        @media  (max-width:480px) and (max-width:720px){
            .container{
                grid-template-areas: 
                "header"
                "header2"
                "sidebar"
                "content"
                "footer"
                "footer2";
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">Hrader</div>
        <div class="header2">header2</div>
        <div class="siderbar">sidebar</div>
        <div class="content">content</div>
        <div class="footer">footer</div>
        <div class="footer2">footer2</div>
    </div>
</body>
</html>
